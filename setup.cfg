[metadata]
name = vbatten-x
version = 0.1.0
author = Nityahapani
description = Physics-informed variational boosting over dynamic latent fields
long_description = file: README.md
long_description_content_type = text/markdown
license = Apache-2.0
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: C++
    Topic :: Scientific/Engineering :: Physics
    Topic :: Scientific/Engineering :: Artificial Intelligence
    License :: OSI Approved :: Apache Software License
    Operating System :: POSIX :: Linux
    Operating System :: MacOS

[options]
package_dir = = python-package
packages = find:
python_requires = >=3.10
install_requires =
    numpy>=1.24
    scipy>=1.10
    scikit-learn>=1.3

[options.extras_require]
viz  = matplotlib>=3.7; networkx>=3.0; plotly>=5.0
dask = dask[distributed]>=2024.1
dev  = pytest>=7.0; coverage>=7.0; black; isort

[tool:pytest]
testpaths = tests/python tests/physics
addopts = -v --tb=short
